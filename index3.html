<!DOCTYPE html>
<html>

<body>
    <h2>javascript objects</h2>
    <p>ways to access an objects property</p>
    <p>you can use .property or ["property"].</p>
    <p id="demo"></p>
    <script>
        // create objects:
        var person = {
            firstname: "I",
            age: 20,
        };
        // Display some data from the object:
        document.getElementById("demo"), innerHTML = person.firstname + "am" + person.age + "years old";

    </script>
</body>

</html>
