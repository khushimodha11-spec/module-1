<html>

<body>
    <p>slcik buttom to get time based greeting</p>
    <button onclick="myfunction()">try it</button>
    <p id="hour"></p>
    <p id="greet"></p>
    <script>
        function myfunction() {
            var greeting;
            var time = new Date().getHours();
            if (time < 20) {
                greeting = "hi";
            }
            else if (time < 15) {
                greeting = "good luck";
            }
            else {
                greeting = "goodbye";
            }
            document.getElementById("hour").innerHTML = "current hour is : " + time;
            document.getElementById("greet").innerHTML = greeting;
        }
    </script>
