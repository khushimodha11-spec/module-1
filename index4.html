<html>
    <body>
       <h2>javascript array methods</h2> 
       <h2> pop () and join()</h2>
       <P id="join"></P>
       <P id="pop1"></P>
       <P id="pop2"></P>
       <script>
         var cars = ["tyota","honda","mercedes","bmw","jaguar","genesis"]
         document.getElementById("join").innerHTML = cars.join(" + ")
         document.getElementById("pop1").innerHTML = cars; cars.pop
         document.getElementById("pop2").innerHTML = cars;
       </script>
    </body>
</html>
